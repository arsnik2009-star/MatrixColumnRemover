name: Тестирование ЛР 4

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Устанавливаю зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Проверяю стиль
        run: python -m flake8 src tests tools --statistics --count
      - name: Запускаю регрессионные тесты
        run: python -m pytest -m regression -v
      - name: Запускаю все тесты с измерением покрытия
        run: python -m coverage run -m pytest -v
      - name: Проверяю порог покрытия
        run: python -m coverage report --fail-under=90
