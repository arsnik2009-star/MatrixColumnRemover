name: Интеграция модулей

on:
  push:
    branches: [main, develop, lr3-bank-api]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Получаю исходный код
        uses: actions/checkout@v4
      - name: Устанавливаю Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Устанавливаю зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Проверяю стиль
        run: flake8 src tests tools
      - name: Запускаю тесты и проверяю покрытие
        run: |
          coverage run -m pytest -v
          coverage report --fail-under=90
      - name: Проверяю REST API
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from src.api import app
          response = TestClient(app).get('/health')
          assert response.status_code == 200
          assert response.json()['status'] == 'ok'
          PY
